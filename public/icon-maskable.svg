<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Mountain Fighters">
  <title>Mountain Fighters</title>
  <!-- Maskable: full bleed, mark inside the 80% safe zone so a circular
       or squircle mask cannot clip the hat or the beard. -->
  <rect width="512" height="512" fill="#0c0a09"/>
  <g transform="translate(256 262) scale(0.7) translate(-256 -262)">
    <!-- hat: the red cap they kept, folded over once -->
    <path d="M256 66 L384 270 L128 270 Z" fill="#e5322d"/>
    <path d="M256 66 L384 270 L300 270 Z" fill="#b5201c"/>
    <path d="M256 66 L322 172 L214 150 Z" fill="#ff5b4a"/>
    <circle cx="256" cy="66" r="26" fill="#ffb524"/>
    <circle cx="248" cy="58" r="9" fill="#ffcb57"/>
    <!-- brow band, studded -->
    <rect x="116" y="262" width="280" height="36" rx="6" fill="#25201c"/>
    <circle cx="156" cy="280" r="7" fill="#ffb524"/>
    <circle cx="206" cy="280" r="7" fill="#ffb524"/>
    <circle cx="256" cy="280" r="7" fill="#ffb524"/>
    <circle cx="306" cy="280" r="7" fill="#ffb524"/>
    <circle cx="356" cy="280" r="7" fill="#ffb524"/>
    <!-- face -->
    <path d="M146 298 h220 a46 46 0 0 1 -46 46 h-128 a46 46 0 0 1 -46 -46 z" fill="#f0c9a4"/>
    <!-- sunglasses, one lens catching the lamp -->
    <path d="M140 300 h232 v14 a30 30 0 0 1 -30 30 h-52 l-12 -16 h-44 l-12 16 h-52 a30 30 0 0 1 -30 -30 z" fill="#0c0a09"/>
    <path d="M168 310 h54 l-12 16 h-44 z" fill="#3c332c"/>
    <path d="M290 310 h54 l-12 16 h-44 z" fill="#3c332c"/>
    <path d="M176 312 l10 0 l-12 12 l-6 0 z" fill="#ffcb57"/>
    <!-- beard -->
    <path d="M168 342 q88 84 176 0 q-22 112 -88 112 q-66 0 -88 -112 z" fill="#f4ecdf"/>
    <path d="M256 384 q-14 40 0 70 q14 -30 0 -70 z" fill="#c2b4a1"/>
  </g>
</svg>
